name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: slime_hunter
          POSTGRES_USER: slime_hunter
          POSTGRES_PASSWORD: slime_hunter_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U slime_hunter -d slime_hunter"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      NODE_ENV: test
      LOG_LEVEL: error
      WEB_ORIGIN: http://localhost:5173
      API_HOST: 0.0.0.0
      API_PORT: 3000
      REALTIME_HOST: 0.0.0.0
      REALTIME_PORT: 2567
      VITE_API_URL: http://localhost:3000
      VITE_REALTIME_URL: ws://localhost:2567
      DATABASE_URL: postgresql://slime_hunter:slime_hunter_dev@localhost:5432/slime_hunter
      REDIS_URL: redis://localhost:6379
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Static quality
        run: pnpm format:check
      - name: Unit and integration tests
        run: pnpm test
      - name: Build
        run: pnpm build
