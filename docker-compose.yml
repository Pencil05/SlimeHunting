services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-slime_hunter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-slime_hunter}
      POSTGRES_DB: ${POSTGRES_DB:-slime_hunter}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
volumes:
  postgres-data:
  redis-data:
